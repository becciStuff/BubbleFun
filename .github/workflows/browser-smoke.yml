name: Browser smoke
on:
  pull_request:
permissions:
  contents: read
jobs:
  arcade-and-puzzles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Exercise actual Arcade and Puzzles with spring gravity
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/bubblefun-http.log 2>&1 &
          sleep 1
          node tests/browser-smoke.mjs
